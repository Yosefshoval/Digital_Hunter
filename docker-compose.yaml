#
#    environment:
#      KAFKA_URL: "kafka:29092"
#      MONGO_URL: "mongodb://mongo_db:27017"
#      MONGO_DATABASE: "digital_hunters"
#
#    depends_on:
#      kafka:
#        condition: service_healthy
#      mongo_db:
#        condition: service_healthy



volumes:
  kafka_kraft:
  elasticsearch-data:
  mongo-data: