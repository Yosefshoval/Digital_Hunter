version: '3.8'

services:

  kafka:
    image: confluentinc/cp-kafka:7.8.3
    container_name: kafka_broker
    ports:
      - "9092:9092"

    environment:

      KAFKA_KRAFT_MODE: 'true'

      CLUSTER_ID: '1L6g7nGhU-eAKfL--X25wo'
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

    volumes:
      - kafka_kraft:/var/lib/kafka/data




#  kafka-ui:
#    image: provectuslabs/kafka-ui:latest
#    ports:
#      - ""


  elasticsearch:
    container_name: elastics
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    ports:
      - 9200:9200
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/datafile
    environment:
#      - xpack.monitoring.enabled=true
      - xpack.watcher.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - discovery.type=single-node


  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana-wolfi:9.3.0
    ports:
      - 5601:5601
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_URL=http://localhost:9200


  mongo_db:
    image: docker.io/library/mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INIT_DATABASE: "digital_hunters"

    volumes:
      - mongo-data:/data/db


volumes:
  kafka_kraft:
  elasticsearch-data:
  mongo-data: